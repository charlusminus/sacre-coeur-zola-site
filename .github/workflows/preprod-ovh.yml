# Préproduction sur l'hébergement OVH de l'école : https://sacrecoeurzola.fr/nouveau-site/
# Même contenu que la démo (Sanity), mais avec l'envoi réel des demandes d'inscription (PHP).
# Le WordPress actuel n'est pas touché : seul le dossier www/nouveau-site/ est remplacé.
# Toujours fermée aux moteurs de recherche (noindex, bandeau « maquette »).
#
# Secrets du dépôt nécessaires (Settings > Secrets and variables > Actions) :
#   OVH_FTP_HOTE            ex. ftp.cluster111.hosting.ovh.net
#   OVH_FTP_UTILISATEUR     identifiant FTP de l'hébergement
#   OVH_FTP_MOT_DE_PASSE    mot de passe FTP
# Variable facultative OVH_FTP_DOSSIER : dossier d'envoi vu par cet utilisateur FTP. Par défaut
# www/nouveau-site (utilisateur principal) ; « . » pour un utilisateur dédié dont le dossier
# racine est déjà www/nouveau-site.
# Sans ces secrets, le workflow s'arrête sans erreur.
name: Préproduction OVH

# Depuis la mise en ligne (19/10/2026), lancée à la main seulement : le site en ligne suit seul
# (workflow Production OVH). Préproduction retirée du serveur le 20/10/2026 (action « supprimer ») ;
# « deployer » la remet en place si besoin.
on:
  workflow_dispatch:
    inputs:
      action:
        description: deployer (remettre la préproduction en ligne) ou supprimer (retirer www/nouveau-site du serveur)
        type: choice
        options: [deployer, supprimer]
        default: deployer

permissions:
  contents: read

concurrency:
  group: preprod-ovh
  cancel-in-progress: false

jobs:
  supprimer:
    if: inputs.action == 'supprimer'
    runs-on: ubuntu-latest
    env:
      HOTE: ${{ secrets.OVH_FTP_HOTE }}
      UTILISATEUR: ${{ secrets.OVH_FTP_UTILISATEUR }}
      MOT_DE_PASSE: ${{ secrets.OVH_FTP_MOT_DE_PASSE }}
    steps:
      - name: Retirer www/nouveau-site du serveur
        # Chemin écrit en dur : jamais tiré d'une variable, pour ne pas viser la racine du site.
        run: |
          sudo apt-get -qq install -y lftp > /dev/null
          lftp -u "$UTILISATEUR","$MOT_DE_PASSE" "$HOTE" -e "set ftp:ssl-allow true; set net:max-retries 3; rm -r -f www/nouveau-site; bye" > /dev/null 2>&1 || true
      - name: Vérifier
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://sacrecoeurzola.fr/nouveau-site/envoi-demande.php)
          echo "Ancien script de la préproduction : $code (404 ou redirection attendus)"; [ "$code" != 405 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' https://sacrecoeurzola.fr/)
          echo "Site en ligne : $code"; [ "$code" = 200 ]

  deployer:
    if: inputs.action != 'supprimer'
    runs-on: ubuntu-latest
    env:
      HOTE: ${{ secrets.OVH_FTP_HOTE }}
      UTILISATEUR: ${{ secrets.OVH_FTP_UTILISATEUR }}
      MOT_DE_PASSE: ${{ secrets.OVH_FTP_MOT_DE_PASSE }}
      DOSSIER: ${{ vars.OVH_FTP_DOSSIER || 'www/nouveau-site' }}
    steps:
      - name: Vérifier les accès
        id: acces
        run: |
          if [ -z "$HOTE" ] || [ -z "$UTILISATEUR" ] || [ -z "$MOT_DE_PASSE" ]; then
            echo "::notice::Secrets OVH absents : préproduction non déployée."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.acces.outputs.pret == 'oui'
        uses: actions/checkout@v4
      - if: steps.acces.outputs.pret == 'oui'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.acces.outputs.pret == 'oui'
        run: npm ci
      - name: Construire la préproduction
        if: steps.acces.outputs.pret == 'oui'
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID || 'vqyjjech' }}
          SITE: https://sacrecoeurzola.fr
          BASE_PATH: /nouveau-site/
          PUBLIC_FORMULAIRE: php
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: npm run build:sanity
      - name: Envoyer sur OVH
        if: steps.acces.outputs.pret == 'oui'
        run: |
          sudo apt-get -qq install -y lftp > /dev/null
          lftp -u "$UTILISATEUR","$MOT_DE_PASSE" "$HOTE" -e "
            set ftp:ssl-allow true; set net:max-retries 3;
            mkdir -p -f $DOSSIER;
            mirror --reverse --delete --parallel=4 --verbose=1 dist/ $DOSSIER/;
            bye"
      - name: Vérifier la préproduction
        if: steps.acces.outputs.pret == 'oui'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://sacrecoeurzola.fr/nouveau-site/inscriptions/)
          echo "Page Inscriptions : $code"; [ "$code" = 200 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' https://sacrecoeurzola.fr/nouveau-site/envoi-demande.php)
          echo "Script d'envoi (GET attendu 405) : $code"; [ "$code" = 405 ]

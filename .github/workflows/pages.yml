# Démonstration sur GitHub Pages. Fusionner une PR sur main = mettre la démo en ligne.
# Réglage requis une fois : Settings > Pages > Source = « GitHub Actions ».
# Chaque PR est vérifiée (build complet avec contrôles de rédaction et de liens) avant fusion.
name: Démo GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Publication depuis le back-office : le webhook Sanity envoie un repository_dispatch « sanity ».
  repository_dispatch:
    types: [sanity]
  # Reconstruction chaque nuit (l'agenda avance seul), et chaque matin vers 8 h 10 heure de Paris
  # (6 h 10 et 7 h 10 UTC, été comme hiver) : les menus programmés par Anne apparaissent à l'heure.
  schedule:
    - cron: '17 3 * * *'
    - cron: '10 6,7 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Contenus : depuis Sanity dès que la variable SANITY_PROJECT_ID du dépôt est renseignée,
      # sinon les fichiers de démonstration de src/contenus/.
      - name: Construire le site
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
        run: |
          if [ -n "$SANITY_PROJECT_ID" ]; then npm run build:sanity; else npm run build; fi
      # Une saisie écartée ou un conflit (deux actualités au même titre) : un ticket pour Charles,
      # le site part quand même.
      - name: Signaler les points à regarder
        if: always() && hashFiles('contenu-sanity/rapport.txt') != '' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s contenu-sanity/rapport.txt ] || exit 0
          { echo "Points relevés au build du $(date -u +%d/%m/%Y\ %H:%M) UTC :"; echo; sed 's/^/- /' contenu-sanity/rapport.txt; } > corps.md
          cat corps.md >> "$GITHUB_STEP_SUMMARY"
          titre="Contenus du back-office : points à regarder"
          num=$(gh issue list --state open --search "\"$titre\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body-file corps.md; else gh issue create --title "$titre" --assignee charlusminus --body-file corps.md; fi
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Le back-office doit toujours se construire : une erreur de schéma bloquerait Anne.
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx sanity build --yes
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID || 'verification' }}

  deployer:
    if: github.event_name != 'pull_request'
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
